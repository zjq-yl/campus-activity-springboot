<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生中心 · 校园活动</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body>
<div class="app-shell"><aside th:replace="~{fragments/navigation :: studentNav}"></aside><div class="main-panel"><header class="topbar"><h1 id="pageTitle">我的空间</h1><div class="topbar-user"><span>学生<br><strong id="currentUser" th:text="${session.name}"></strong></span><span class="avatar">学</span><button id="logout" class="d-none">退出</button></div></header>
<main class="content student-content"><div id="message" hidden></div>
<section id="studentBanner" class="student-banner"><div class="student-identity"><div id="studentAvatar" class="student-avatar">学</div><div><p class="eyebrow mb-1">我的成长档案</p><h2 id="studentName">学生</h2><p id="studentClass" class="mb-0">班级加载中</p></div></div><div class="student-score"><span>活动总分</span><strong id="totalPoints">0</strong><small>参与活动，记录每一份成长</small></div></section>
<section id="scoreSection"><div class="section-heading"><div><p class="eyebrow mb-1">POINTS BY CATEGORY</p><h2>分类积分</h2></div><a class="section-link" href="/student/points">查看积分详情 →</a></div><div id="categories" class="score-grid"></div><div class="card distribution-panel"><div class="distribution-chart"><div id="pointsDonut" class="points-donut"><span id="donutTotal">0<small>总分</small></span></div></div><div class="distribution-copy"><h3>积分分布</h3><p id="distributionHint" class="text-muted">参加活动后，积分会按类别显示在这里。</p><div id="pointsLegend" class="points-legend"></div></div></div></section>
<section id="historySection"><div class="section-heading"><div><p class="eyebrow mb-1">MY ACTIVITIES</p><h2>参与记录</h2></div><a class="btn btn-primary btn-sm" href="/hall">发现新活动</a></div><div id="history" class="activity-list"></div></section>
</main></div></div><script src="/js/app.js"></script><script src="/js/student.js"></script></body></html>
