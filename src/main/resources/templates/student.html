<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的活动与积分 · 校园活动</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body>
<div class="app-shell"><aside th:replace="~{fragments/navigation :: studentNav}"></aside><div class="main-panel"><header class="topbar"><h1 id="pageTitle">我的空间</h1><div class="topbar-user"><span>学生<br><strong id="currentUser" th:text="${session.name}"></strong></span><span class="avatar">学</span><button id="logout" class="d-none">退出</button></div></header>
<main class="content"><div id="message" hidden></div><div class="hero mb-4"><p class="mb-1 opacity-75">个人成长档案</p><h1 class="h2 mb-2">我的活动与积分</h1><p class="mb-0">查看个人资料、七类积分以及报名和签到记录。</p></div>
<section id="profileSection" class="row g-3 mb-4"><div class="col-lg-4"><div class="card card-body h-100"><p class="eyebrow mb-2">学生资料</p><h2 id="studentName" class="h4"></h2><dl id="profile" class="row mb-0"></dl></div></div><div class="col-lg-8"><div class="metric h-100 d-flex align-items-center justify-content-between"><div><p class="eyebrow mb-2">综合积分</p><strong id="totalPoints">0</strong><span class="text-muted">成功签到或免签到活动结束后计入</span></div><span style="font-size:4rem;color:#c6e9e3">★</span></div></div></section>
<h2 id="categoriesTitle" class="h5 mb-3">分类积分</h2><div id="categories" class="row g-3 mb-5"></div>
<div id="historyTitle" class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 m-0">参与记录</h2><a href="/hall" class="btn btn-primary btn-sm">发现新活动</a></div><div id="historyTable" class="card overflow-auto"><table class="table align-middle mb-0"><thead><tr><th>活动</th><th>时间</th><th>报名状态</th><th>参与状态</th><th>获得积分</th><th>操作</th></tr></thead><tbody id="history"></tbody></table></div></main></div></div>
<script src="/js/app.js"></script><script src="/js/student.js"></script></body></html>
