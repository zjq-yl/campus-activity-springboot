<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动审核 · 校园活动</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body><div class="app-shell"><aside th:replace="~{fragments/navigation :: adminNav}"></aside><div class="main-panel"><header class="topbar"><h1>☑ 活动审核</h1><div class="topbar-user"><span>系统管理员<br><strong id="currentUser" th:text="${session.name}"></strong></span><span class="avatar">管</span><button id="logout" class="d-none">退出</button></div></header><main class="content"><div id="message" hidden></div><div class="row g-3 mb-4"><div class="col-md-6"><div class="dashboard-card d-flex align-items-center gap-3"><span class="dashboard-icon orange">☑</span><div><div id="pendingCount" class="dashboard-number">0</div><div class="dashboard-label">待审核活动</div></div></div></div><div class="col-md-6"><div class="dashboard-card d-flex align-items-center gap-3"><span class="dashboard-icon purple">▤</span><div><div id="reviewCount" class="dashboard-number">0</div><div class="dashboard-label">历史审核</div></div></div></div></div><h2 class="h6 mb-3">待审核活动</h2><div id="pending" class="row g-3 mb-5"></div><section id="history" class="table-panel"><div class="panel-heading"><h2 class="h6 m-0">审核历史</h2></div><div class="table-responsive"><table class="table"><thead><tr><th>活动</th><th>结果</th><th>审核人</th><th>时间</th><th>审核意见</th></tr></thead><tbody id="reviewHistory"></tbody></table></div></section></main></div></div><script src="/js/app.js"></script><script src="/js/admin.js"></script></body></html>
