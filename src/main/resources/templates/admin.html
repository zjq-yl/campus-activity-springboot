<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>审核工作台 · 校园活动</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body>
<header class="app-header py-3"><div class="container d-flex justify-content-between align-items-center"><a class="brand fs-5" href="/admin">校园活动</a><nav class="d-flex gap-4"><a class="active" href="/admin">审核工作台</a></nav><div><span id="currentUser" th:text="${session.name}"></span> <button id="logout" class="btn btn-sm btn-outline-light ms-2">退出</button></div></div></header>
<main class="container py-4"><div id="message" hidden></div><div class="hero mb-4"><p class="mb-1 opacity-75">活动审核中心</p><h1 class="h2 mb-2">管理员审核工作台</h1><p class="mb-0">审核负责人提交的活动，保留每一次通过或驳回的意见。</p></div>
<div class="row g-3 mb-4"><div class="col-md-6"><div class="metric"><small>待审核活动</small><strong id="pendingCount">0</strong></div></div><div class="col-md-6"><div class="metric"><small>历史审核</small><strong id="reviewCount">0</strong></div></div></div>
<h2 class="h5 mb-3">待审核活动</h2><div id="pending" class="row g-3 mb-5"></div>
<h2 class="h5 mb-3">审核历史</h2><div class="card overflow-auto"><table class="table mb-0"><thead><tr><th>活动</th><th>结果</th><th>审核人</th><th>时间</th><th>审核意见</th></tr></thead><tbody id="reviewHistory"></tbody></table></div></main>
<script src="/js/app.js"></script><script src="/js/admin.js"></script></body></html>
