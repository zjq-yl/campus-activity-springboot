<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>负责人工作台 · 校园活动</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body>
<div class="app-shell"><aside th:replace="~{fragments/navigation :: ownerNav}"></aside><div class="main-panel"><header class="topbar"><h1 id="pageTitle">我的活动</h1><div class="topbar-user"><span>活动负责人<br><strong id="currentUser" th:text="${session.name}"></strong></span><span class="avatar">负</span><button id="logout" class="d-none">退出</button></div></header>
<main class="content"><div id="message" hidden></div><div class="hero mb-4"><p class="mb-1 opacity-75">活动组织中心</p><h1 class="h2 mb-2">负责人工作台</h1><p class="mb-0">创建活动、处理审核反馈、管理签到与查看参与名单。</p></div>
<div class="row g-3 mb-4"><div class="col-md-4"><div class="metric"><small>全部活动</small><strong id="allCount">0</strong></div></div><div class="col-md-4"><div class="metric"><small>待审核</small><strong id="pendingCount">0</strong></div></div><div class="col-md-4"><div class="metric"><small>已结束</small><strong id="endedCount">0</strong></div></div></div>
<ul class="nav nav-pills gap-2 mb-3"><li class="nav-item"><button class="nav-link active" data-tab="current">活动管理</button></li><li class="nav-item"><button class="nav-link" data-tab="ended">已结束与统计</button></li><li class="nav-item"><button class="nav-link" data-tab="create">发布新活动</button></li></ul>
<section id="activitySection"><div id="activityRows" class="row g-3"></div></section>
<section id="formSection" hidden><div class="card card-body p-4"><div class="d-flex justify-content-between"><h2 id="formTitle" class="h5">创建活动</h2><button type="button" class="btn-close" onclick="showTab('current')"></button></div><form id="activityForm" class="row g-3"><div class="col-md-8"><label class="form-label">活动名称</label><input name="title" class="form-control" required maxlength="100"></div><div class="col-md-4"><label class="form-label">活动类别</label><input name="category" class="form-control" required maxlength="30" placeholder="讲座 / 志愿服务 / 社团活动"></div><div class="col-md-6"><label class="form-label">积分维度</label><select name="pointCategory" class="form-select"></select></div><div class="col-md-3"><label class="form-label">活动积分</label><input name="points" type="number" min="0" max="1000" value="1" class="form-control" required></div><div class="col-md-3"><label class="form-label">签到方式</label><select name="checkinRequired" class="form-select"><option value="true">现场签到</option><option value="false">免签到，结束后计分</option></select></div><div class="col-md-8"><label class="form-label">活动地点</label><input name="location" class="form-control" required></div><div class="col-md-4"><label class="form-label">人数上限</label><input name="capacity" type="number" min="1" class="form-control" required></div><div class="col-md-4"><label class="form-label">报名截止</label><input name="signupDeadline" type="datetime-local" class="form-control" required></div><div class="col-md-4"><label class="form-label">活动开始</label><input name="startAt" type="datetime-local" class="form-control" required></div><div class="col-md-4"><label class="form-label">活动结束</label><input name="endAt" type="datetime-local" class="form-control" required></div><div class="col-12"><label class="form-label">活动介绍</label><textarea name="description" class="form-control" rows="4"></textarea></div><div class="col-12"><button class="btn btn-primary">保存草稿</button></div></form></div></section></main></div></div>
<dialog id="details"><div class="p-4"><button class="btn-close float-end" onclick="$('#details').close()"></button><div id="detailsBody"></div></div></dialog>
<script src="/js/app.js"></script><script src="/js/owner.js"></script></body></html>
