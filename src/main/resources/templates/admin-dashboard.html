<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仪表盘 · 学生管理系统</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body><div class="app-shell"><aside th:replace="~{fragments/navigation :: adminNav}"></aside><div class="main-panel"><header class="topbar"><h1>▦ 仪表盘</h1><div class="topbar-user"><span>系统管理员<br><strong id="currentUser" th:text="${session.name}"></strong></span><span class="avatar">管</span><button id="logout" class="d-none">退出</button></div></header><main class="content"><div id="message" hidden></div><div class="row g-3 mb-4"><div class="col-sm-6 col-xl-3"><div class="dashboard-card d-flex align-items-center gap-3"><span class="dashboard-icon">♙</span><div><div id="studentsCount" class="dashboard-number">—</div><div class="dashboard-label">学生总数</div></div></div></div><div class="col-sm-6 col-xl-3"><div class="dashboard-card d-flex align-items-center gap-3"><span class="dashboard-icon green">♟</span><div><div id="ownersCount" class="dashboard-number">—</div><div class="dashboard-label">负责人总数</div></div></div></div><div class="col-sm-6 col-xl-3"><div class="dashboard-card d-flex align-items-center gap-3"><span class="dashboard-icon orange">▣</span><div><div id="activitiesCount" class="dashboard-number">—</div><div class="dashboard-label">活动总数</div></div></div></div><div class="col-sm-6 col-xl-3"><div class="dashboard-card d-flex align-items-center gap-3"><span class="dashboard-icon purple">☑</span><div><div id="registrationsCount" class="dashboard-number">—</div><div class="dashboard-label">有效报名人次</div></div></div></div></div><div class="row g-3"><div class="col-lg-4"><div class="dashboard-card management-card"><span class="dashboard-icon">♙</span><h2>学生管理</h2><p>新增、编辑、停用学生账号</p><a href="/admin/students" class="btn btn-primary btn-sm">进入管理</a></div></div><div class="col-lg-4"><div class="dashboard-card management-card"><span class="dashboard-icon green">☑</span><h2>活动审核</h2><p><span id="pendingCount">0</span> 项活动等待审核</p><a href="/admin/audits" class="btn btn-success btn-sm">进入审核</a></div></div><div class="col-lg-4"><div class="dashboard-card management-card"><span class="dashboard-icon orange">▤</span><h2>审核历史</h2><p>查看审核结果和驳回意见</p><a href="/admin/audits#history" class="btn btn-warning btn-sm">查看记录</a></div></div></div></main></div></div><script src="/js/app.js"></script><script src="/js/admin-dashboard.js"></script></body></html>
