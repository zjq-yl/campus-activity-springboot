<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生管理 · 校园活动</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body><div class="app-shell"><aside th:replace="~{fragments/navigation :: adminNav}"></aside><div class="main-panel"><header class="topbar"><h1>♙ 学生管理</h1><div class="topbar-user"><span>系统管理员<br><strong id="currentUser" th:text="${session.name}"></strong></span><span class="avatar">管</span><button id="logout" class="d-none">退出</button></div></header><main class="content"><div id="message" hidden></div><section class="table-panel"><div class="panel-heading gap-3 flex-wrap"><h2 class="h6 m-0">学生列表</h2><form id="searchForm" class="d-flex gap-2 ms-auto"><input name="q" class="form-control form-control-sm" placeholder="搜索学号 / 姓名 / 专业"><button class="btn btn-primary btn-sm">搜索</button></form><button id="addStudent" class="btn btn-primary btn-sm">＋ 添加学生</button></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>学号</th><th>姓名</th><th>性别</th><th>专业</th><th>班级</th><th>入学年份</th><th>用户名</th><th>操作</th></tr></thead><tbody id="studentRows"></tbody></table></div></section></main></div></div>
<dialog id="studentDialog"><div class="p-4"><button class="btn-close float-end" onclick="$('#studentDialog').close()"></button><h2 id="dialogTitle" class="h5 mb-4">添加学生</h2><form id="studentForm" class="row g-3"><div class="col-md-6"><label class="form-label">学号</label><input name="studentNo" class="form-control" required></div><div class="col-md-6"><label class="form-label">姓名</label><input name="name" class="form-control" required></div><div class="col-md-6"><label class="form-label">用户名</label><input name="account" class="form-control" required></div><div class="col-md-6"><label class="form-label">密码（编辑时留空表示不修改）</label><input name="password" type="password" class="form-control" minlength="6"></div><div class="col-md-6"><label class="form-label">性别</label><select name="gender" class="form-select"><option value="">未填写</option><option>男</option><option>女</option></select></div><div class="col-md-6"><label class="form-label">入学年份</label><input name="year" type="number" min="2000" max="2100" class="form-control" required></div><div class="col-md-6"><label class="form-label">学院</label><input name="college" class="form-control"></div><div class="col-md-6"><label class="form-label">专业</label><input name="major" class="form-control"></div><div class="col-12"><label class="form-label">班级</label><input name="className" class="form-control"></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary">保存</button><button type="button" class="btn btn-outline-secondary" onclick="$('#studentDialog').close()">取消</button></div></form></div></dialog>
<script src="/js/app.js"></script><script src="/js/admin-students.js"></script></body></html>
