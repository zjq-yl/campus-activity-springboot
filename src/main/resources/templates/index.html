<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 校园活动</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head>
<body class="auth-page">
<header class="auth-header"><a href="/" class="auth-brand"><span>✦</span><strong>校园活动系统</strong></a></header>
<main class="auth-main"><div class="auth-card"><div class="auth-intro"><span class="auth-mark">✦</span><p class="eyebrow mb-2">CAMPUS ACTIVITY</p><h1>让每一次参与<br>都有记录与成长</h1><p>发现活动、报名签到、积累属于自己的校园成长积分。</p></div>
<section class="auth-form-panel"><div class="auth-tabs"><button id="loginTab" type="button" class="active" aria-selected="true">账号登录</button><button id="registerTab" type="button" aria-selected="false">学生注册</button></div><div id="message" hidden></div>
<form id="login" class="auth-form"><h2>欢迎回来</h2><p>登录后继续探索校园活动</p><label for="loginAccount">账号</label><input id="loginAccount" name="account" class="form-control" required autocomplete="username" placeholder="请输入账号"><label for="loginPassword">密码</label><input id="loginPassword" name="password" type="password" class="form-control" required autocomplete="current-password" placeholder="请输入密码"><button class="btn btn-primary w-100 mt-3">登录系统</button></form>
<form id="register" class="auth-form" hidden><h2>创建学生账号</h2><p>填写真实学号和个人信息</p><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="auth-form-grid"><div><label for="regAccount">账号</label><input id="regAccount" name="account" class="form-control" required pattern="[A-Za-z0-9_]{3,50}" autocomplete="username" placeholder="3 位以上字母或数字"></div><div><label for="regName">姓名</label><input id="regName" name="name" class="form-control" required maxlength="50" placeholder="真实姓名"></div><div><label for="regStudentNo">学号</label><input id="regStudentNo" name="studentNo" class="form-control" required placeholder="请输入学号"></div><div><label for="regYear">入学年份</label><input id="regYear" name="year" type="number" min="2000" max="2100" class="form-control" required placeholder="例如 2026"></div><div><label for="regCollege">学院</label><input id="regCollege" name="college" class="form-control" placeholder="学院名称"></div><div><label for="regClass">班级</label><input id="regClass" name="className" class="form-control" placeholder="班级名称"></div><div><label for="regPassword">密码</label><input id="regPassword" name="password" type="password" minlength="6" class="form-control" required autocomplete="new-password" placeholder="至少 6 位"></div><div><label for="regConfirm">确认密码</label><input id="regConfirm" name="confirmPassword" type="password" minlength="6" class="form-control" required autocomplete="new-password" placeholder="再次输入密码"></div></div><button class="btn btn-primary w-100 mt-3">注册并登录</button></form>
</section></div></main>
<script src="/js/app.js"></script><script>
const destination={STUDENT:'/student',OWNER:'/owner',ADMIN:'/admin'};
fetch('/me').then(r=>r.ok?r.json():null).then(user=>{if(user)location.href=destination[user.role]});
function showAuth(mode){const register=mode==='register';$('#login').hidden=register;$('#register').hidden=!register;$('#loginTab').classList.toggle('active',!register);$('#registerTab').classList.toggle('active',register);$('#loginTab').setAttribute('aria-selected',String(!register));$('#registerTab').setAttribute('aria-selected',String(register));$('#message').hidden=true;location.hash=register?'register':''}
$('#loginTab').onclick=()=>showAuth('login');$('#registerTab').onclick=()=>showAuth('register');if(location.hash==='#register')showAuth('register');
$('#login').onsubmit=async event=>{event.preventDefault();try{const user=await api('/login',new FormData(event.target));location.href=destination[user.role]}catch(error){message(error.message,'danger')}};
$('#register').onsubmit=async event=>{event.preventDefault();const form=event.target;if(form.elements.password.value!==form.elements.confirmPassword.value){message('两次输入的密码不一致','danger');return}try{await api('/register',new FormData(form));const user=await api('/login',{account:form.elements.account.value,password:form.elements.password.value});location.href=destination[user.role]}catch(error){message(error.message,'danger')}};
</script></body></html>
