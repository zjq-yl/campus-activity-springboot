<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 校园活动</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body>
<header class="app-header py-3"><div class="container"><span class="brand fs-5">校园活动报名与签到</span></div></header>
<main class="container py-5"><div class="row align-items-center g-5"><div class="col-lg-6"><p class="eyebrow">Campus Activity</p><h1 class="display-5 fw-bold mb-3">让每一次参与<br>都有记录与成长</h1><p class="lead text-muted">发现活动、报名签到、积累思想成长、社会实践、志愿公益等七类成长积分。</p><div class="row g-3 mt-4"><div class="col-6"><div class="metric"><strong>7</strong><span>成长积分维度</span></div></div><div class="col-6"><div class="metric"><strong>3</strong><span>角色协同流程</span></div></div></div></div><div class="col-lg-5 offset-lg-1"><div class="card card-body p-4 p-md-5"><p class="eyebrow">欢迎回来</p><h2 class="h3 mb-3">登录系统</h2><div id="message" hidden></div><form id="login" class="vstack gap-3"><div><label class="form-label">账号</label><input name="account" class="form-control form-control-lg" required autocomplete="username" placeholder="学号或账号"></div><div><label class="form-label">密码</label><input name="password" type="password" class="form-control form-control-lg" required autocomplete="current-password"></div><button class="btn btn-primary btn-lg mt-2">登录</button></form><p class="small text-muted mt-4 mb-0">演示账号：student1、owner、admin；密码 demo123</p></div></div></div></main>
<script src="/js/app.js"></script><script>const destination={STUDENT:'/student',OWNER:'/owner',ADMIN:'/admin'};fetch('/me').then(r=>r.ok?r.json():null).then(u=>{if(u)location.href=destination[u.role]});$('#login').onsubmit=async e=>{e.preventDefault();try{const user=await api('/login',new FormData(e.target));location.href=destination[user.role]}catch(error){message(error.message,'danger')}};</script></body></html>
