<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动大厅 · 校园活动</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body>
<div class="app-shell"><aside th:replace="~{fragments/navigation :: studentNav}"></aside><div class="main-panel"><header class="topbar"><h1>活动大厅</h1><div class="topbar-user"><span>学生<br><strong id="currentUser" th:text="${session.name}"></strong></span><span class="avatar">学</span><button id="logout" class="d-none">退出</button></div></header>
<main class="content student-content"><div id="message" hidden></div><div class="section-heading"><div><p class="eyebrow mb-1">EXPLORE ACTIVITIES</p><h2>发现校园活动</h2><p class="text-muted mb-0">按活动日期查看安排和可获得的积分</p></div></div>
<section class="calendar-panel card mb-4"><div class="calendar-heading"><div><h2>活动日历</h2><p>选一天查看活动与积分</p></div><div class="calendar-controls"><button id="prevMonth" type="button" aria-label="上个月">‹</button><strong id="calendarMonth"></strong><button id="nextMonth" type="button" aria-label="下个月">›</button></div></div><div id="calendar" class="calendar-grid"></div><p id="calendarSummary" class="calendar-summary"></p></section>
<form id="filters" class="card filter-panel mb-4"><div><label class="form-label">搜索活动</label><input name="q" class="form-control" placeholder="输入活动名称"></div><div><label class="form-label">活动类别</label><select name="category" class="form-select"><option value="">全部类别</option></select></div><div><label class="form-label">活动日期</label><input name="day" type="date" class="form-control"></div><button class="btn btn-primary">搜索</button><button id="clearFilters" type="button" class="btn btn-outline-secondary">清除</button></form>
<div class="section-heading"><div><p class="eyebrow mb-1">ACTIVITY LIST</p><h2>全部活动</h2></div></div><div id="cards" class="activity-list"></div><div class="d-flex justify-content-center align-items-center gap-3 my-4"><button id="previous" class="btn btn-outline-secondary">上一页</button><span id="page"></span><button id="next" class="btn btn-outline-secondary">下一页</button></div>
</main></div></div><dialog id="detail"><div class="p-4"><button class="btn-close float-end" aria-label="关闭" onclick="$('#detail').close()"></button><div id="detailBody"></div></div></dialog><script src="/js/app.js"></script><script src="/js/hall.js"></script></body></html>
