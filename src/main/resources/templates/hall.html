<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动大厅 · 校园活动</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body>
<div class="app-shell"><aside th:replace="~{fragments/navigation :: studentNav}"></aside><div class="main-panel"><header class="topbar"><h1 id="pageTitle">活动大厅</h1><div class="topbar-user"><span>学生<br><strong id="currentUser" th:text="${session.name}"></strong></span><span class="avatar">学</span><button id="logout" class="d-none">退出</button></div></header>
<main class="content"><div id="message" hidden></div><div class="hero mb-4"><p class="mb-1 opacity-75">发现校园精彩</p><h1 class="h2 mb-2">活动大厅</h1><p class="mb-0">浏览活动、查看积分、报名与签到，所有状态都会实时更新。</p></div>
<form id="filters" class="card card-body row g-3 flex-row align-items-end mb-4"><div class="col-md-6"><label class="form-label">活动名称</label><input name="q" class="form-control" placeholder="搜索讲座、志愿服务、文体活动"></div><div class="col-md-4"><label class="form-label">活动类别</label><select name="category" class="form-select"><option value="">全部类别</option></select></div><div class="col-md-2"><button class="btn btn-primary w-100">搜索</button></div></form>
<div id="cards" class="row g-3"></div><div class="d-flex justify-content-center align-items-center gap-3 my-4"><button id="previous" class="btn btn-outline-secondary">上一页</button><span id="page"></span><button id="next" class="btn btn-outline-secondary">下一页</button></div></main></div></div>
<dialog id="detail"><div class="p-4"><button class="btn-close float-end" aria-label="关闭" onclick="$('#detail').close()"></button><div id="detailBody"></div></div></dialog>
<script src="/js/app.js"></script><script src="/js/hall.js"></script></body></html>
